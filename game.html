  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/styles.css?v=20260516" />
  <script>document.documentElement.classList.add('js');</script>
  <script defer src="assets/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="page">
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html" class="brand">Jongwon Lim</a>
        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" data-nav-toggle>
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" data-nav-panel>
          <a href="index.html">Home</a>
          <a href="research.html">Research</a>
          <a href="cv.pdf">CV</a>
          <a href="blog.html">Blog</a>
          <a href="game.html" aria-current="page">Play a game</a>
          <button class="theme-toggle" type="button" aria-label="Toggle color theme" data-theme-toggle>Dark</button>
        </div>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    <section class="page-hero">
      <p class="kicker">Mini Game</p>
      <h1>Ostrich Runner</h1>
      <p>
        I like ostriches. Do you?
      </p>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>Play</h2>
      </div>
      <div class="section-body">
        <div class="game-panel" data-runner-game>
          <div class="game-status">
            <span>Score: <strong data-runner-score>0</strong></span>
            <span>Distance: <strong data-runner-distance>0</strong> m</span>
            <span>Best: <strong data-runner-best>0</strong></span>
            <span>Speed: <strong data-runner-speed>1.0</strong>x</span>
            <button type="button" data-runner-start>Start</button>
          </div>
          <div class="runner-stage">
            <canvas class="runner-canvas" width="760" height="360" data-runner-canvas aria-label="Ostrich Runner game board"></canvas>
            <form class="score-form score-form-overlay" data-score-form hidden>
              <label>
                Name for high score
                <input name="name" maxlength="24" autocomplete="nickname" required />
              </label>
              <button type="submit">Save score</button>
            </form>
          </div>
          <div class="runner-controls" aria-label="Game controls">
            <button type="button" data-runner-jump>Jump</button>
            <button type="button" data-runner-duck>Duck / Drop</button>
          </div>
          <p class="game-message" data-runner-message>Space or tap to jump. Press down mid-air to drop.</p>
          <div class="high-score-board">
            <h3>Top 10 Scores</h3>
            <ol data-high-scores></ol>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer page">
    <p>&copy; <span data-year></span> Jongwon Lim.</p>
    <a href="index.html">Home</a>
  </footer>
</body>
</html>
