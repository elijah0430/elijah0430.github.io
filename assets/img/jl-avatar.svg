<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Jongwon Lim initials avatar</title>
  <desc id="desc">A geometric initials avatar for Jongwon Lim.</desc>
  <defs>
    <linearGradient id="g" x1="20" y1="10" x2="220" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edf2ff"/>
      <stop offset="0.48" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="56" fill="url(#g)"/>
  <circle cx="184" cy="48" r="34" fill="#fff" opacity=".55"/>
  <circle cx="42" cy="196" r="56" fill="#fff" opacity=".38"/>
  <g filter="url(#shadow)">
    <rect x="46" y="54" width="152" height="132" rx="34" fill="#0f172a" opacity=".88"/>
    <text x="120" y="139" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="2" fill="#ffffff">JL</text>
  </g>
</svg>
